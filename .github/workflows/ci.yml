# IDA Place — intégration continue de l'API (SEC-23 / SEC-42).
# Bloque la fusion si : typage, tests unitaires, tests e2e, build, audit des
# dépendances de production (élevé/critique), analyse de secrets ou build de
# l'image échouent.
name: CI

on:
  push:
    branches: [master]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  SCARF_ANALYTICS: 'false'

jobs:
  verify:
    name: Lint, tests, build
    runs-on: ubuntu-latest
    timeout-minutes: 30
    services:
      # Base jetable pour le test d'intégration du journal scellé
      # (test/ledger-postgres.e2e-spec.ts, remis à zéro à chaque exécution).
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_DB: ida_place_it
          POSTGRES_USER: ida_place_it
          POSTGRES_PASSWORD: ci-ephemeral-only
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U ida_place_it"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    steps:
      - uses: actions/checkout@v4

      # Node 22 LTS, comme l'image Docker : le package-lock.json est accepté
      # par le npm 10 de Node 22 (régénéré le 2026-10-20, voir Dockerfile).
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      # Aucun script d'installation tiers exécuté (télémétrie comprise).
      - name: Installation
        run: npm ci --ignore-scripts

      - name: Secrets éphémères de test
        run: |
          echo "DEV_JWT_SECRET=$(openssl rand -hex 32)" >> "$GITHUB_ENV"
          echo "LEDGER_HMAC_KEY=$(openssl rand -hex 32)" >> "$GITHUB_ENV"

      - name: Lint (tsc --noEmit)
        run: npm run lint

      - name: Tests unitaires
        run: npm test -- --ci

      - name: Tests e2e (AUTH_PROVIDER=dev, hors production)
        env:
          NODE_ENV: test
          AUTH_PROVIDER: dev
          LEDGER_IT_DB_HOST: 127.0.0.1
          LEDGER_IT_DB_PORT: '5432'
          LEDGER_IT_DB_NAME: ida_place_it
          LEDGER_IT_DB_USER: ida_place_it
          LEDGER_IT_DB_PASSWORD: ci-ephemeral-only
        run: npm run test:e2e -- --ci

      - name: Build
        run: npm run build

      - name: Audit des dépendances de production
        # Bloquant sur tout avis élevé/critique non analysé ; exceptions justifiées
        # et datées dans security/audit-exceptions.json (SEC-42).
        run: npm run audit:gate

  secrets:
    name: Analyse de secrets (gitleaks)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: gitleaks (historique complet)
        run: |
          docker run --rm -v "$PWD:/repo" ghcr.io/gitleaks/gitleaks:v8.21.2 \
            detect --source /repo --redact --verbose --exit-code 1

  docker:
    name: Image Docker
    runs-on: ubuntu-latest
    timeout-minutes: 20
    needs: verify
    steps:
      - uses: actions/checkout@v4
      - name: Build des images (API et job de migration)
        run: |
          docker build -t ida-place-api:ci .
          docker build --target migrator -t ida-place-api-migrator:ci .
      - name: Image d'exécution non-root, sans source map ni dépendance de développement
        run: |
          test "$(docker run --rm --entrypoint id ida-place-api:ci -u)" != "0"
          test -z "$(docker run --rm --entrypoint find ida-place-api:ci /app/dist -name '*.map')"
          ! docker run --rm --entrypoint ls ida-place-api:ci /app/node_modules/@nestjs/cli
          ! docker run --rm --entrypoint ls ida-place-api:ci /app/node_modules/jest
